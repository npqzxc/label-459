version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tool-platform-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - tool-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tool-platform-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - tool-network

networks:
  tool-network:
    driver: bridge
